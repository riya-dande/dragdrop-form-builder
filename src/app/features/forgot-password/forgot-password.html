<section class="auth-page">
  <div class="auth-panel">
    <p class="eyebrow">Account Recovery</p>
    <h1>Forgot password</h1>

    <p class="hint">
      Enter your email. We will send a reset link, then take you to Gmail.
    </p>

    <ol class="recovery-steps">
      <li [class.active]="!emailSent">Enter your email</li>
      <li [class.active]="emailSent">Open Gmail and click the reset link</li>
      <li>Set your new password</li>
    </ol>

    <form class="login-form" (ngSubmit)="requestReset()" novalidate>
      <label>
        <span>Email</span>
        <input
          pInputText
          type="email"
          name="email"
          [(ngModel)]="email"
          (ngModelChange)="clearMessage()"
          autocomplete="email"
          required />
      </label>

      <p class="login-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="login-success" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <button
        pButton
        type="submit"
        label="Send reset link"
        icon="pi pi-envelope"
        [disabled]="isSubmitting">
      </button>

      <button
        *ngIf="emailSent && !resetLink"
        pButton
        type="button"
        label="Go to Gmail now"
        icon="pi pi-external-link"
        severity="secondary"
        (click)="openGmail()">
      </button>

      <button
        *ngIf="resetLink"
        pButton
        type="button"
        label="Open reset page"
        icon="pi pi-key"
        severity="secondary"
        (click)="openResetPage()">
      </button>
    </form>

    <p class="auth-switch">
      Remembered your password?
      <a routerLink="/auth">Login</a>
    </p>
  </div>
</section>
