<section class="dashboard">
  <header class="breadcrumb-bar">
    <div class="breadcrumb-copy">
      <div class="breadcrumb-path">
        <strong>Apps</strong>
        <span class="apps-count">{{ filteredApps.length }}</span>
      </div>

      <p>Create and manage app containers for your forms.</p>
    </div>

    <div class="topbar-tools">
      <div class="toolbar-actions">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="search"
          [(ngModel)]="searchText"
          (input)="onSearch()"
          placeholder="Search apps" />
      </div>

      <button
        *ngIf="auth.isSignedIn()"
        pButton
        type="button"
        label="Create App"
        icon="pi pi-plus"
        class="top-create-btn"
        (click)="createApp()">
      </button>
    </div>
  </header>

  <p *ngIf="errorMessage" class="dashboard-error">
    {{ errorMessage }}
  </p>

  <section class="apps-grid" aria-label="Admin apps">
    <article
      class="app-widget"
      *ngFor="let app of filteredApps"
      (click)="openApp(app.id)"
      tabindex="0"
      role="button"
      (keydown.enter)="openApp(app.id)">
      <header class="app-card-top">
        <div class="app-name">
          <div class="app-icon-box">
            <i class="pi pi-file-edit"></i>
          </div>
          <div class="app-title">
            <h3>{{ app.name }}</h3>
          </div>
        </div>

        <div class="app-menu" *ngIf="auth.isSignedIn()">
          <button
            type="button"
            class="app-menu-btn"
            aria-label="App options"
            title="App options"
            (click)="toggleAppMenu(app.id, $event)">
            <i class="pi pi-ellipsis-h"></i>
          </button>

          <div
            class="app-menu-list"
            *ngIf="openMenuAppId === app.id"
            (click)="$event.stopPropagation()">
            <button type="button" (click)="editApp(app, $event)">
              Edit App
            </button>
            <button type="button" (click)="viewFormBuilder(app.id, $event)">
              View Form Builder
            </button>
            <button type="button" class="danger" (click)="deleteApp(app.id, $event)">
              Delete App
            </button>
          </div>
        </div>
      </header>

      <button
        type="button"
        class="app-open-btn"
        aria-label="Open app records"
        title="Open app records"
        (click)="$event.stopPropagation(); openApp(app.id)">
        <i class="pi pi-arrow-right"></i>
      </button>

      <div class="app-card-divider"></div>

      <footer class="app-card-bottom">
        <div class="app-meta">
          <time>Updated {{ formatAppDate(app.createdAt) }}</time>
        </div>
      </footer>
    </article>
  </section>
</section>
