<section class="auth-page">
  <div class="auth-panel">
    <p class="eyebrow">Account Recovery</p>
    <h1>Set new password</h1>

    <p class="hint">
      This page opens from the link in Gmail. Enter a new password for your account.
    </p>

    <form class="login-form" (ngSubmit)="resetPassword()" novalidate>
      <label>
        <span>New password</span>
        <input
          pInputText
          type="password"
          name="password"
          [(ngModel)]="password"
          (ngModelChange)="clearMessage()"
          autocomplete="new-password"
          required />
      </label>

      <label>
        <span>Confirm password</span>
        <input
          pInputText
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          (ngModelChange)="clearMessage()"
          autocomplete="new-password"
          required />
      </label>

      <p class="login-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="login-success" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <button
        pButton
        type="submit"
        label="Set password"
        icon="pi pi-key"
        [disabled]="isSubmitting || !!successMessage">
      </button>
    </form>

    <p class="auth-switch">
      Need a new link?
      <a routerLink="/forgot-password">Send reset email</a>
    </p>
  </div>
</section>
